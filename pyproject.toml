[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-ledger"
version = "0.1.0"
description = "Auditable clinical abstraction CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "openai>=1.68,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
care-ledger = "care_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
care_ledger = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest-tmp"
